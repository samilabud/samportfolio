# Project deep links: serve the home page and let src/scripts/deepLink.js
# scroll to the matching project row.
[[redirects]]
  from = "/plantpal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/piano-pop"
  to = "/index.html"
  status = 200

# Send the netlify.app address to the custom domain so search engines
# consolidate on https://samilabud.com.
[[redirects]]
  from = "https://samilabud.netlify.app/*"
  to = "https://samilabud.com/:splat"
  status = 301
  force = true
